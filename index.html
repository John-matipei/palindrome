<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome | Smart Checker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #172554, #020617 65%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 20px 60px #0008;
    text-align: center;
    animation: appear .7s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(25px);}
    to {opacity: 1; transform: translateY(0);}
}

.logo {
    font-size: 42px;
    margin-bottom: 12px;
}

h1 {
    font-size: 28px;
    color: #38bdf8;
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 28px;
}

.input-box {
    position: relative;
}

input {
    width: 100%;
    padding: 17px;
    border-radius: 12px;
    border: 1px solid #475569;
    background: #020617;
    color: white;
    font-size: 16px;
    outline: none;
    transition: .3s;
}

input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 12px #38bdf855;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

button {
    flex: 1;
    padding: 14px 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: .3s;
}

.check {
    background: #0284c7;
    color: white;
}

.check:hover {
    background: #0ea5e9;
    transform: translateY(-2px);
}

.clear {
    background: #334155;
    color: white;
}

.clear:hover {
    background: #475569;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    background: #1e293b;
    display: none;
    animation: appear .4s ease;
}

.result h2 {
    font-size: 19px;
    margin-bottom: 10px;
}

.result p {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 8px;
    overflow-wrap: anywhere;
}

.success {
    border: 1px solid #22c55e;
    color: #4ade80;
}

.error {
    border: 1px solid #ef4444;
    color: #f87171;
}

.examples {
    margin-top: 25px;
    text-align: left;
}

.examples h3 {
    color: #38bdf8;
    font-size: 14px;
    margin-bottom: 12px;
}

.example-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.example-list span {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    color: #cbd5e1;
}

.example-list span:hover {
    border-color: #38bdf8;
    color: white;
}

footer {
    margin-top: 30px;
    color: #64748b;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🔄</div>

    <h1>Palindrome Checker</h1>

    <p class="subtitle">
        Discover whether your text reads the same
        forward and backward.
    </p>

    <div class="input-box">
        <input
            type="text"
            id="userInput"
            placeholder="Enter a word or number..."
            onkeydown="if(event.key === 'Enter') checkPalindrome()"
        >
    </div>

    <div class="buttons">
        <button class="check" onclick="checkPalindrome()">
            Check Now
        </button>

        <button class="clear" onclick="clearAll()">
            Clear
        </button>
    </div>

    <div class="result" id="result">
        <h2 id="status"></h2>
        <p id="original"></p>
        <p id="reversed"></p>
        <p id="message"></p>
    </div>

    <div class="examples">
        <h3>TRY AN EXAMPLE</h3>

        <div class="example-list">
            <span onclick="useExample('MADAM')">MADAM</span>
            <span onclick="useExample('LEVEL')">LEVEL</span>
            <span onclick="useExample('121')">121</span>
            <span onclick="useExample('HELLO')">HELLO</span>
        </div>
    </div>

    <footer>
        SMART PALINDROME SYSTEM<br>
        Developed with HTML, CSS & JavaScript
    </footer>

</div>

<script>

function checkPalindrome() {

    let input = document.getElementById("userInput").value;

    let result = document.getElementById("result");
    let status = document.getElementById("status");

    if (input.trim() === "") {
        alert("Please enter some text first!");
        return;
    }

    // Remove spaces and punctuation
    let cleaned = input.toLowerCase().replace(/[^a-z0-9]/g, "");

    let reversed = cleaned.split("").reverse().join("");

    result.style.display = "block";

    document.getElementById("original").innerText =
        "Original: " + input;

    document.getElementById("reversed").innerText =
        "Reversed: " + reversed;

    if (cleaned === reversed) {

        result.className = "result success";

        status.innerText = "✓ PALINDROME DETECTED";

        document.getElementById("message").innerText =
            "Excellent! Your text reads the same in both directions.";

    } else {

        result.className = "result error";

        status.innerText = "✗ NOT A PALINDROME";

        document.getElementById("message").innerText =
            "The original and reversed text do not match.";

    }
}

function clearAll() {

    document.getElementById("userInput").value = "";

    document.getElementById("result").style.display = "none";

    document.getElementById("userInput").focus();
}

function useExample(value) {

    document.getElementById("userInput").value = value;

    checkPalindrome();
}

</script>

</body>
</html>
